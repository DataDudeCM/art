<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Rain Worn v0.1</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #cfc9bd;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    canvas {
      display: block;

      box-shadow:
        0 0 0 1px rgba(120, 105, 85, 0.18),
        0 10px 30px rgba(80, 65, 45, 0.14);
    }

    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;

      padding: 8px 10px;

      background: rgba(216, 211, 199, 0.92);
      border: 1px solid rgba(120, 105, 85, 0.25);
      border-radius: 8px;

      font: 12px/1.5 system-ui, sans-serif;
      color: #3f3a33;
    }

    #status .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 3px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      vertical-align: -1px;
    }

    #status .swatch.current {
      outline: 2px solid #3f3a33;
      outline-offset: 1px;
    }

    #status .keys {
      color: #6b6357;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.min.js"></script>
</head>

<body>

  <div id="status"></div>

  <script src="/common/js/palette.js"></script>

  <script src="js/paper.js"></script>
  <script src="js/pigment.js"></script>
  <script src="js/composition.js"></script>
  <script src="js/rain.js"></script>
  <script src="js/sketch.js"></script>

</body>

</html>
