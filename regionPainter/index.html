<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>regionPainter</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #ddd6c8;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      flex: 1;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-container canvas {
      display: block;
    }

    #controls {
      width: 260px;
      box-sizing: border-box;
      padding: 22px;
      background: #f2eee6;
      border-left: 1px solid #c8c1b5;
      overflow-y: auto;
    }

    #controls h1 {
      margin: 0 0 24px;
      font-size: 20px;
      font-weight: 600;
    }

    .control-section {
      margin-bottom: 14px;
    }

    .control-section > label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 600;
    }

    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 12px;
    }

    button {
      cursor: pointer;
      margin-bottom: 12px;
    }

    .checkbox-row {
      display: flex !important;
      align-items: center;
      gap: 8px;
      font-weight: normal !important;
    }

    .checkbox-row input {
      margin: 0;
    }
    .status {
      margin: 10px 0 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid #c8c1b5;
    }

    .status.idle {
      background: #f7f3ec;
      color: #5f5a52;
    }

    .status.generating {
      background: #e9efe8;
      color: #2f4a34;
      font-weight: 600;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-row input[type="range"] {
      flex: 1;
      min-width: 0;
    }

    .range-value {
      width: 38px;
      text-align: right;
      font-size: 11px;
      color: #5f5a52;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>

    <aside id="controls">
      <h1>regionPainter</h1>

      <section class="control-section">
        <label for="preset-select">Preset</label>
        <select id="preset-select"></select>
      </section>

      <section class="control-section">
        <label for="palette-select">Palette</label>
        <select id="palette-select"></select>
      </section>

      <section class="control-section">
        <label for="boundary-brush-mode">
          Boundary Mode
        </label>

        <select id="boundary-brush-mode">
          <option value="image">Brush</option>
          <option value="line">Line</option>
        </select>
      </section>

      <section class="control-section">
        <label for="boundary-brush-select">
          Boundary Brush
        </label>

        <select id="boundary-brush-select"></select>
      </section>

      <section class="control-section">
        <label for="boundary-brush-size">
          Thin Brush Size
        </label>

        <div class="range-row">
          <input
            id="boundary-brush-size"
            type="range"
            min="1"
            max="50"
            step="1"
          />
          <span
            id="boundary-brush-size-value"
            class="range-value"
          ></span>
        </div>
      </section>

      <section class="control-section">
        <label for="boundary-multiplier">
          Mid Multiplier
        </label>

        <div class="range-row">
          <input
            id="boundary-multiplier"
            type="range"
            min="1"
            max="8"
            step="0.1"
          />
          <span
            id="boundary-multiplier-value"
            class="range-value"
          ></span>
        </div>
      </section>

      <section class="control-section">
        <label for="boundary-alpha">
          Brush Alpha
        </label>

        <div class="range-row">
          <input
            id="boundary-alpha"
            type="range"
            min="1"
            max="255"
            step="1"
          />
          <span
            id="boundary-alpha-value"
            class="range-value"
          ></span>
        </div>
      </section>

      <section class="control-section">
        <label for="boundary-scale">
          Boundary Scale
        </label>

        <div class="range-row">
          <input
            id="boundary-scale"
            type="range"
            min="0.5"
            max="10"
            step="0.05"
          />
          <span
            id="boundary-scale-value"
            class="range-value"
          ></span>
        </div>
      </section>

      <section class="control-section">
        <label for="boundary-point-count">
          Point Count
        </label>

        <div class="range-row">
          <input
            id="boundary-point-count"
            type="range"
            min="4"
            max="100"
            step="1"
          />
          <span
            id="boundary-point-count-value"
            class="range-value"
          ></span>
        </div>
      </section>

      <section class="control-section">
        <label for="boundary-subdivisions">
          Subdivisions
        </label>

        <div class="range-row">
          <input
            id="boundary-subdivisions"
            type="range"
            min="0"
            max="10"
            step="1"
          />
          <span
            id="boundary-subdivisions-value"
            class="range-value"
          ></span>
        </div>
      </section>

      <section class="control-section">
        <button id="generate-button">
          Generate
        </button>

        <div id="generation-status" class="status idle">
          Ready
        </div>

        <label class="checkbox-row">
          <input
            type="checkbox"
            id="auto-regenerate"
          />
          Auto regenerate
        </label>
      </section>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <script src="../common/js/palette.js"></script>

  <script src="js/settings.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/boundary.js"></script>
  <script src="js/floodfill.js"></script>
  <script src="js/painter.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sketch.js"></script>
</body>
</html>
