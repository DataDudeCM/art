<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>regionPainter</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>

    <aside id="controls">
      <h1>regionPainter</h1>

      <section class="control-section">
        <label for="preset-select">Preset</label>
        <select id="preset-select"></select>
      </section>

      <section class="control-section">
        <label for="palette-select">Palette</label>
        <select id="palette-select"></select>
        <div
          id="active-palette"
          class="control-note"
        >
          Current: —
        </div>
      </section>

      

      <section class="control-section">
        <label class="checkbox-row">
          <input
            type="checkbox"
            id="boundary-visible"
          />
          Show boundary
        </label>
      </section>

      <section class="control-section">
        <label for="boundary-brush-mode">
          Boundary Mode
        </label>

        <select id="boundary-brush-mode">
          <option value="image">Brush</option>
          <option value="line">Line</option>
        </select>
      </section>

      <section class="control-section">
        <label for="boundary-brush-select">
          Boundary Brush
        </label>

        <select id="boundary-brush-select"></select>
      </section>

      <section class="control-section compact">
        <label for="boundary-brush-size">
          Thin Brush Size
        </label>

        <div class="range-row">
          <input
            id="boundary-brush-size"
            type="range"
            min="1"
            max="50"
            step="1"
          />
          <span
            id="boundary-brush-size-value"
            class="range-value"
          ></span>
        </div>

        <label for="boundary-multiplier">
          Mid Multiplier
        </label>

        <div class="range-row">
          <input
            id="boundary-multiplier"
            type="range"
            min="1"
            max="8"
            step="0.1"
          />
          <span
            id="boundary-multiplier-value"
            class="range-value"
          ></span>
        </div>

        <label for="boundary-alpha">
          Brush Alpha
        </label>

        <div class="range-row">
          <input
            id="boundary-alpha"
            type="range"
            min="1"
            max="255"
            step="1"
          />
          <span
            id="boundary-alpha-value"
            class="range-value"
          ></span>
        </div>
        <label for="boundary-scale">
          Boundary Scale
        </label>

        <div class="range-row">
          <input
            id="boundary-scale"
            type="range"
            min="0.5"
            max="10"
            step="0.05"
          />
          <span
            id="boundary-scale-value"
            class="range-value"
          ></span>
        </div>

        <label for="boundary-point-count">
          Point Count
        </label>

        <div class="range-row">
          <input
            id="boundary-point-count"
            type="range"
            min="4"
            max="100"
            step="1"
          />
          <span
            id="boundary-point-count-value"
            class="range-value"
          ></span>
        </div>

        <label for="boundary-subdivisions">
          Subdivisions
        </label>

        <div class="range-row">
          <input
            id="boundary-subdivisions"
            type="range"
            min="0"
            max="10"
            step="1"
          />
          <span
            id="boundary-subdivisions-value"
            class="range-value"
          ></span>
        </div>
      </section>

      <section class="control-section">
        <button id="generate-button">
          Generate
        </button>

        <div id="generation-status" class="status idle">
          Ready
        </div>

        <label class="checkbox-row">
          <input
            type="checkbox"
            id="auto-regenerate"
          />
          Auto regenerate
        </label>
      </section>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <script src="../common/js/palette.js"></script>

  <script src="js/settings.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/boundary.js"></script>
  <script src="js/floodfill.js"></script>
  <script src="js/painter.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sketch.js"></script>
</body>
</html>
