<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>regionPainter</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>

    <aside id="controls">
      <h1>regionPainter</h1>

      <section class="control-group setup-group">
        <div class="control-item">
          <label for="preset-select">Preset</label>
          <select id="preset-select"></select>
        </div>
        <div class="preset-actions">
          <button id="save-preset-button">
            Save
          </button>

          <button id="load-preset-button">
            Load
          </button>

          <input
            id="preset-file-input"
            type="file"
            accept=".json,application/json"
            hidden
          />
        </div>

        <div class="control-item">
          <label for="palette-select">Palette</label>
          <select id="palette-select"></select>

          <div
            id="active-palette"
            class="control-note"
          >
            Using: —
          </div>
        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group texture-group collapsible-group collapsed" 
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Surface Texture</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <button id="texture-file-button">
              Choose Texture
            </button>

            <input
              id="texture-file-input"
              type="file"
              accept="image/*"
              hidden
            />

            <div
              id="texture-file-name"
              class="control-note"
            >
              No texture selected
            </div>
          </div>

          <div class="control-item">
            <label for="texture-opacity">
              Opacity
            </label>

            <div class="range-row">
              <input
                id="texture-opacity"
                type="range"
                min="0"
                max="255"
                step="1"
              />

              <span
                id="texture-opacity-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="texture-scale">
              Scale
            </label>

            <div class="range-row">
              <input
                id="texture-scale"
                type="range"
                min="0.5"
                max="3"
                step="0.05"
              />

              <span
                id="texture-scale-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="texture-blend-mode">
              Blend Mode
            </label>

            <select id="texture-blend-mode">
              <option value="multiply">Multiply</option>
              <option value="overlay">Overlay</option>
              <option value="screen">Screen</option>
              <option value="normal">Normal</option>
            </select>
          </div>
        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group boundary-group collapsible-group"
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="true"
        >
          <span>Boundary</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <label class="checkbox-row">
              <input
                type="checkbox"
                id="boundary-visible"
              />
              Show boundary
            </label>
          </div>

          <div class="control-item">
            <label for="boundary-brush-mode">
              Boundary Mode
            </label>

            <select id="boundary-brush-mode">
              <option value="image">Brush</option>
              <option value="line">Line</option>
            </select>
          </div>

          <div class="control-item">
            <label for="boundary-scale">
              Scale
            </label>

            <div class="range-row">
              <input
                id="boundary-scale"
                type="range"
                min="0.5"
                max="10"
                step="0.05"
              />

              <span
                id="boundary-scale-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-point-count">
              Point Count
            </label>

            <div class="range-row">
              <input
                id="boundary-point-count"
                type="range"
                min="4"
                max="100"
                step="1"
              />

              <span
                id="boundary-point-count-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-subdivisions">
              Subdivisions
            </label>

            <div class="range-row">
              <input
                id="boundary-subdivisions"
                type="range"
                min="0"
                max="10"
                step="1"
              />

              <span
                id="boundary-subdivisions-value"
                class="range-value"
              ></span>
            </div>
          </div>
        </div>  
      </section>


      <div class="control-divider"></div>

      <section class="control-group fill-group collapsible-group">
        <button
          type="button"
          class="section-toggle"
          aria-expanded="true"
        >
          <span>Fill</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">
          <div class="control-item">
            <label for="fill-brush-select">
              Fill Brush
            </label>

            <select id="fill-brush-select"></select>
          </div>

          <div class="control-item">
            <label for="fill-attempts">
              Fill Attempts
            </label>

            <div class="range-row">
              <input
                id="fill-attempts"
                type="range"
                min="1"
                max="200"
                step="1"
              />

              <span
                id="fill-attempts-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-bleed-amount">
              Bleed Amount
            </label>

            <div class="range-row">
              <input
                id="fill-bleed-amount"
                type="range"
                min="0"
                max="30"
                step="1"
              />

              <span
                id="fill-bleed-amount-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-bleed-strength">
              Bleed Strength
            </label>

            <div class="range-row">
              <input
                id="fill-bleed-strength"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="fill-bleed-strength-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-strength">
              Fill Strength
            </label>

            <div class="range-row">
              <input
                id="fill-strength"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="fill-strength-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-opacity-variation">
              Opacity Variation
            </label>

            <div class="range-row">
              <input
                id="fill-opacity-variation"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="fill-opacity-variation-value"
                class="range-value"
              ></span>
            </div>
          </div>



          <div class="control-item">
            <label for="fill-marks-per-region">
              Marks Per Region
            </label>

            <div class="range-row">
              <input
                id="fill-marks-per-region"
                type="range"
                min="20"
                max="600"
                step="1"
              />

              <span
                id="fill-marks-per-region-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-brush-size-min">
              Brush Size Min
            </label>

            <div class="range-row">
              <input
                id="fill-brush-size-min"
                type="range"
                min="1"
                max="200"
                step="1"
              />

              <span
                id="fill-brush-size-min-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-brush-size-max">
              Brush Size Max
            </label>

            <div class="range-row">
              <input
                id="fill-brush-size-max"
                type="range"
                min="1"
                max="500"
                step="1"
              />

              <span
                id="fill-brush-size-max-value"
                class="range-value"
              ></span>
            </div>
          </div>
        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group brush-group collapsible-group collapsed"
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Boundary Brush</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <label for="boundary-brush-select">
              Brush
            </label>

            <select id="boundary-brush-select"></select>
          </div>

          <div class="control-item">
            <label for="boundary-brush-size">
              Thin Brush Size
            </label>

            <div class="range-row">
              <input
                id="boundary-brush-size"
                type="range"
                min="1"
                max="50"
                step="1"
              />

              <span
                id="boundary-brush-size-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-multiplier">
              Mid Multiplier
            </label>

            <div class="range-row">
              <input
                id="boundary-multiplier"
                type="range"
                min="1"
                max="8"
                step="0.1"
              />

              <span
                id="boundary-multiplier-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-peak-position">
              Peak Position
            </label>

            <div class="range-row">
              <input
                id="boundary-peak-position"
                type="range"
                min="0.1"
                max="0.9"
                step="0.05"
              />

              <span
                id="boundary-peak-position-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-size-jitter">
              Size Jitter
            </label>

            <div class="range-row">
              <input
                id="boundary-size-jitter"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="boundary-size-jitter-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-alpha">
              Brush Alpha
            </label>

            <div class="range-row">
              <input
                id="boundary-alpha"
                type="range"
                min="1"
                max="255"
                step="1"
              />

              <span
                id="boundary-alpha-value"
                class="range-value"
              ></span>
            </div>
          </div>
        </div>
      </section>


      <div class="control-divider"></div>


      <section class="control-group action-group">

        <div class="control-item">
          <label for="generation-seed">
            Seed
          </label>

          <div class="seed-row">
            <input
              id="generation-seed"
              type="number"
              min="0"
              max="999999999"
              step="1"
            />

            <button
              id="new-seed-button"
              type="button"
            >
              New
            </button>
          </div>
        </div>

        <button id="generate-button">
          Generate
        </button>

        <div
          id="generation-status"
          class="status idle"
        >
          Ready
        </div>

        <div class="control-item">
          <label class="checkbox-row">
            <input
              type="checkbox"
              id="auto-regenerate"
            />
            Auto regenerate
          </label>
        </div>

      </section>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <script src="../common/js/palette.js"></script>

  <script src="js/settings.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/boundary.js"></script>
  <script src="js/floodfill.js"></script>
  <script src="js/painter.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/texture.js"></script>
  <script src="js/sketch.js"></script>
</body>
</html>
