<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>regionPainter</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>

    <aside id="controls">
      <h1>regionPainter</h1>

       <section class="control-group action-group">

        <div class="control-item">
          <label for="generation-seed">
            Seed
          </label>

          <div class="seed-row">
            <input
              id="generation-seed"
              type="number"
              min="0"
              max="999999999"
              step="1"
            />

            <button
              id="new-seed-button"
              type="button"
            >
              New
            </button>
          </div>
        </div>

        <button id="generate-button">
          Generate
        </button>

        <div
          id="generation-status"
          class="status idle"
        >
          Ready
        </div>

        <div class="control-item">
          <label class="checkbox-row">
            <input
              type="checkbox"
              id="auto-regenerate"
            />
            Auto regenerate
          </label>
        </div>

        <div class="control-item">
          <label class="checkbox-row">
            <input
              type="checkbox"
              id="animation-enabled"
            />
            Animate generation
          </label>
        </div>

      </section>

      <section class="control-group setup-group">
        <div class="control-item">
          <label for="preset-select">Preset</label>
          <select id="preset-select"></select>
        </div>
        <div class="preset-actions">
          <button id="save-preset-button">
            Save
          </button>

          <button id="load-preset-button">
            Load
          </button>

          <input
            id="preset-file-input"
            type="file"
            accept=".json,application/json"
            hidden
          />
        </div>

        <div class="control-item">
          <label for="palette-select">Palette</label>
          <select id="palette-select"></select>

          <div
            id="active-palette"
            class="control-note"
          >
            Using: —
          </div>
        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group grid-group collapsible-group collapsed"
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Grid</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <label class="checkbox-row">
              <input
                type="checkbox"
                id="grid-enabled"
              />
              Enable Grid
            </label>
          </div>

          <div class="control-item">
            <label for="grid-rows">
              Rows
            </label>

            <div class="range-row">
              <input
                id="grid-rows"
                type="range"
                min="1"
                max="4"
                step="1"
              />

              <span
                id="grid-rows-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="grid-cols">
              Columns
            </label>

            <div class="range-row">
              <input
                id="grid-cols"
                type="range"
                min="1"
                max="4"
                step="1"
              />

              <span
                id="grid-cols-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="grid-gutter">
              Cell Border / Gutter
            </label>

            <div class="range-row">
              <input
                id="grid-gutter"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="grid-gutter-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="grid-outer-margin">
              Outer Margin
            </label>

            <div class="range-row">
              <input
                id="grid-outer-margin"
                type="range"
                min="0"
                max="150"
                step="1"
              />

              <span
                id="grid-outer-margin-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="canvas-background-mode">
              Background
            </label>

            <select id="canvas-background-mode">
              <option value="palette">
                Palette
              </option>
              <option value="white">
                White
              </option>
              <option value="black">
                Black
              </option>
            </select>
          </div>

          <div class="control-item">
            <label for="grid-outline-mode">
              Cell Outline
            </label>

            <select id="grid-outline-mode">
              <option value="none">
                None
              </option>
              <option value="white">
                White
              </option>
              <option value="black">
                Black
              </option>
            </select>
          </div>

        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group grid-variation-group collapsible-group collapsed"
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Grid Variation</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <label class="checkbox-row">
              <input
                type="checkbox"
                id="grid-variation-enabled"
              />
              Enable Grid Variation
            </label>
          </div>

          <div class="control-item">
            <label for="grid-row-parameter">
              Row Parameter
            </label>
            <select id="grid-row-parameter"></select>
          </div>

          <div class="control-item">
            <label for="grid-row-start">
              Row Start
            </label>

            <div class="range-row">
              <input
                id="grid-row-start"
                type="range"
                min="0"
                max="100"
                step="1"
              />
              <span
                id="grid-row-start-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="grid-row-end">
              Row End
            </label>

            <div class="range-row">
              <input
                id="grid-row-end"
                type="range"
                min="0"
                max="100"
                step="1"
              />
              <span
                id="grid-row-end-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="grid-col-parameter">
              Column Parameter
            </label>
            <select id="grid-col-parameter"></select>
          </div>

          <div class="control-item">
            <label for="grid-col-start">
              Column Start
            </label>

            <div class="range-row">
              <input
                id="grid-col-start"
                type="range"
                min="0"
                max="100"
                step="1"
              />
              <span
                id="grid-col-start-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="grid-col-end">
              Column End
            </label>

            <div class="range-row">
              <input
                id="grid-col-end"
                type="range"
                min="0"
                max="100"
                step="1"
              />
              <span
                id="grid-col-end-value"
                class="range-value"
              ></span>
            </div>
          </div>

        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group texture-group collapsible-group collapsed" 
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Surface Texture</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <button id="texture-file-button">
              Choose Texture
            </button>

            <input
              id="texture-file-input"
              type="file"
              accept="image/*"
              hidden
            />

            <div
              id="texture-file-name"
              class="control-note"
            >
              No texture selected
            </div>
          </div>

          <div class="control-item">
            <label for="texture-opacity">
              Opacity
            </label>

            <div class="range-row">
              <input
                id="texture-opacity"
                type="range"
                min="0"
                max="255"
                step="1"
              />

              <span
                id="texture-opacity-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="texture-scale">
              Scale
            </label>

            <div class="range-row">
              <input
                id="texture-scale"
                type="range"
                min="0.5"
                max="3"
                step="0.05"
              />

              <span
                id="texture-scale-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="texture-blend-mode">
              Blend Mode
            </label>

            <select id="texture-blend-mode">
              <option value="multiply">Multiply</option>
              <option value="overlay">Overlay</option>
              <option value="screen">Screen</option>
              <option value="normal">Normal</option>
            </select>
          </div>
        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group boundary-group collapsible-group collapsed"
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Boundary</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <label for="boundary-source">
              Boundary Source
            </label>

            <select id="boundary-source">
              <option value="chaikin">Chaikin</option>
              <option value="particleChaikin">Particle Chaikin</option>
              <option value="rectangle">Rectangle</option>
              <option value="drawn">Drawn</option>
            </select>
          </div>

          <div
            id="drawn-boundary-controls"
            class="control-item"
          >
            <div class="preset-actions">
              <button
                id="clear-drawing-button"
                type="button"
              >
                Clear Drawing
              </button>

              <button
                id="complete-drawing-button"
                type="button"
              >
                Complete
              </button>
            </div>

            <div
              id="drawing-status"
              class="control-note"
            >
              Draw on the canvas
            </div>
          </div>

          <div class="control-item">
            <label class="checkbox-row">
              <input
                type="checkbox"
                id="boundary-visible"
              />
              Show boundary
            </label>
          </div>

          <div class="control-item">
            <label for="boundary-brush-mode">
              Boundary Mode
            </label>

            <select id="boundary-brush-mode">
              <option value="image">Brush</option>
              <option value="line">Line</option>
            </select>
          </div>

          <div class="control-item">
            <label for="boundary-scale">
              Scale
            </label>

            <div class="range-row">
              <input
                id="boundary-scale"
                type="range"
                min="0.5"
                max="10"
                step="0.05"
              />

              <span
                id="boundary-scale-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-point-count">
              Point Count
            </label>

            <div class="range-row">
              <input
                id="boundary-point-count"
                type="range"
                min="4"
                max="100"
                step="1"
              />

              <span
                id="boundary-point-count-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div
            id="particle-count-control"
            class="control-item"
          >
            <label for="particle-count">
              Particle Count
            </label>

            <div class="range-row">
              <input
                id="particle-count"
                type="range"
                min="1"
                max="20"
                step="1"
              />

              <span
                id="particle-count-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div
            id="particle-max-speed-control"
            class="control-item"
          >
            <label for="particle-max-speed">
              Max Speed
            </label>

            <div class="range-row">
              <input
                id="particle-max-speed"
                type="range"
                min="1"
                max="20"
                step="0.5"
              />

              <span
                id="particle-max-speed-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div
            id="particle-motion-mode-control"
            class="control-item"
          >
            <label for="particle-motion-mode">
              Motion Mode
            </label>

            <select id="particle-motion-mode">
              <option value="noise">
                Noise
              </option>

              <option value="attractor">
                Attractor + Noise
              </option>
            </select>
          </div>

          <div
            id="particle-attractor-strength-control"
            class="control-item"
          >
            <label for="particle-attractor-strength">
              Attractor Strength
            </label>

            <div class="range-row">
              <input
                id="particle-attractor-strength"
                type="range"
                min="0"
                max="0.5"
                step="0.01"
              />

              <span
                id="particle-attractor-strength-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div
            id="particle-feed-mode-control"
            class="control-item"
          >
            <label for="particle-feed-mode">
              Point Feed Mode
            </label>

            <select id="particle-feed-mode">
              <option value="roundRobin">
                Round Robin
              </option>

              <option value="sequential">
                Sequential
              </option>

              <option value="randomParticle">
                Random Particle
              </option>
            </select>
          </div>
          <div
            id="particle-sampling-mode-control"
            class="control-item"
          >
            <label for="particle-sampling-mode">
              Sampling Mode
            </label>

            <select id="particle-sampling-mode">
              <option value="interval">
                Interval
              </option>

              <option value="headingChange">
                Heading Change
              </option>
            </select>
          </div>
          <div
            id="particle-heading-threshold-control"
            class="control-item"
          >
            <label for="particle-heading-threshold">
              Heading Threshold
            </label>

            <div class="range-row">
              <input
                id="particle-heading-threshold"
                type="range"
                min="5"
                max="90"
                step="1"
              />

              <span
                id="particle-heading-threshold-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-subdivisions">
              Subdivisions
            </label>

            <div class="range-row">
              <input
                id="boundary-subdivisions"
                type="range"
                min="0"
                max="10"
                step="1"
              />

              <span
                id="boundary-subdivisions-value"
                class="range-value"
              ></span>
            </div>
          </div>
        </div>  
      </section>


      <div class="control-divider"></div>

      <section class="control-group fill-group collapsible-group collapsed">
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Fill</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">
          <div class="control-item">
            <label for="fill-brush-select">
              Fill Brush
            </label>

            <select id="fill-brush-select"></select>
          </div>

          <div class="control-item">
            <label for="fill-color-mode">
              Color Mode
            </label>

            <select id="fill-color-mode">
              <option value="fixedPerRegion">
                Fixed Per Region
              </option>

              <option value="randomPerHit">
                Random Per Hit
              </option>
            </select>
          </div>
          <div class="control-item">
            <label for="fill-attempts">
              Fill Attempts
            </label>

            <div class="range-row">
              <input
                id="fill-attempts"
                type="range"
                min="1"
                max="100"
                step="1"
              />

              <span
                id="fill-attempts-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-sample-mode">
              Region Pick Mode
            </label>

            <select id="fill-sample-mode">
              <option value="uniform">
                Uniform
              </option>

              <option value="centerWeighted">
                Center Weighted
              </option>
            </select>
          </div>

          <div
            id="fill-center-weight-control"
            class="control-item"
          >
            <label for="fill-center-weight">
              Center Weight
            </label>

            <div class="range-row">
              <input
                id="fill-center-weight"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="fill-center-weight-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-bleed-amount">
              Bleed Amount
            </label>

            <div class="range-row">
              <input
                id="fill-bleed-amount"
                type="range"
                min="0"
                max="30"
                step="1"
              />

              <span
                id="fill-bleed-amount-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-bleed-strength">
              Bleed Strength
            </label>

            <div class="range-row">
              <input
                id="fill-bleed-strength"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="fill-bleed-strength-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-edge-expansion">
              Edge Expansion
            </label>

            <div class="range-row">
              <input
                id="fill-edge-expansion"
                type="range"
                min="0"
                max="8"
                step="1"
              />

              <span
                id="fill-edge-expansion-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-strength">
              Fill Strength
            </label>

            <div class="range-row">
              <input
                id="fill-strength"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="fill-strength-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-opacity-variation">
              Opacity Variation
            </label>

            <div class="range-row">
              <input
                id="fill-opacity-variation"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="fill-opacity-variation-value"
                class="range-value"
              ></span>
            </div>
          </div>



          <div class="control-item">
            <label for="fill-marks-per-region">
              Marks Per Region
            </label>

            <div class="range-row">
              <input
                id="fill-marks-per-region"
                type="range"
                min="20"
                max="600"
                step="1"
              />

              <span
                id="fill-marks-per-region-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-brush-size-min">
              Brush Size Min
            </label>

            <div class="range-row">
              <input
                id="fill-brush-size-min"
                type="range"
                min="1"
                max="200"
                step="1"
              />

              <span
                id="fill-brush-size-min-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="fill-brush-size-max">
              Brush Size Max
            </label>

            <div class="range-row">
              <input
                id="fill-brush-size-max"
                type="range"
                min="1"
                max="500"
                step="1"
              />

              <span
                id="fill-brush-size-max-value"
                class="range-value"
              ></span>
            </div>
          </div>
        </div>
      </section>

      <div class="control-divider"></div>

      <section
        class="control-group brush-group collapsible-group collapsed"
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>Boundary Brush</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">

          <div class="control-item">
            <label for="boundary-brush-select">
              Brush
            </label>

            <select id="boundary-brush-select"></select>
          </div>

          <div class="control-item">
            <label for="boundary-brush-size">
              Thin Brush Size
            </label>

            <div class="range-row">
              <input
                id="boundary-brush-size"
                type="range"
                min="1"
                max="50"
                step="1"
              />

              <span
                id="boundary-brush-size-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-multiplier">
              Mid Multiplier
            </label>

            <div class="range-row">
              <input
                id="boundary-multiplier"
                type="range"
                min="1"
                max="8"
                step="0.1"
              />

              <span
                id="boundary-multiplier-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-peak-position">
              Peak Position
            </label>

            <div class="range-row">
              <input
                id="boundary-peak-position"
                type="range"
                min="0.1"
                max="0.9"
                step="0.05"
              />

              <span
                id="boundary-peak-position-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-size-jitter">
              Size Jitter
            </label>

            <div class="range-row">
              <input
                id="boundary-size-jitter"
                type="range"
                min="0"
                max="100"
                step="1"
              />

              <span
                id="boundary-size-jitter-value"
                class="range-value"
              ></span>
            </div>
          </div>

          <div class="control-item">
            <label for="boundary-alpha">
              Brush Alpha
            </label>

            <div class="range-row">
              <input
                id="boundary-alpha"
                type="range"
                min="1"
                max="255"
                step="1"
              />

              <span
                id="boundary-alpha-value"
                class="range-value"
              ></span>
            </div>
          </div>
        </div>
      </section>


      <div class="control-divider"></div>

      <section
        class="control-group view-group collapsible-group collapsed"
      >
        <button
          type="button"
          class="section-toggle"
          aria-expanded="false"
        >
          <span>View</span>
          <span class="section-arrow">▾</span>
        </button>

        <div class="section-content">
          <div class="control-item">
            <label class="checkbox-row">
              <input
                type="checkbox"
                id="view-show-paint"
              />
              Show Paint
            </label>
