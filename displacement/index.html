<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Displacement Mapper</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.min.js"></script>

  <style>
    :root {
      /*
       * Fallbacks only.
       * ui.js replaces these with colors
       * from industrialSun in palette.js.
       */
      --ui-dark: #272727;
      --ui-warm: #fed766;
      --ui-cool: #009fb7;
      --ui-neutral: #696773;
      --ui-light: #eff1f3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: var(--ui-dark);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    canvas {
      display: block;
    }

    #control-panel {
      position: fixed;
      top: 0;
      right: 0;

      width: 320px;
      height: 100vh;

      padding: 28px 24px;

      overflow-y: auto;

      background:
        var(--ui-dark);

      color:
        var(--ui-light);

      border-left:
        1px solid var(--ui-neutral);
    }

    .panel-header {
      margin-bottom: 30px;
    }

    .panel-title {
      color:
        var(--ui-warm);

      font-size: 17px;
      font-weight: 700;

      letter-spacing: 0.12em;
    }

    .panel-subtitle {
      margin-top: 5px;

      color:
        var(--ui-neutral);

      font-size: 12px;
    }

    .control-section {
      margin-bottom: 28px;
    }

    .section-title {
      margin-bottom: 10px;

      color:
        var(--ui-neutral);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.14em;
    }

    .source-info {
      margin-top: 7px;

      color:
        var(--ui-neutral);

      font-size: 11px;
    }

    .file-input {
      width: 100%;

      color:
        var(--ui-light);

      font-size: 12px;
    }

    .file-input::file-selector-button {
      margin-right: 10px;

      padding: 7px 10px;

      color:
        var(--ui-dark);

      background:
        var(--ui-light);

      border: 0;
      border-radius: 3px;

      font-weight: 600;

      cursor: pointer;
    }

    .file-input::file-selector-button:hover {
      background:
        var(--ui-warm);
    }

    .mode-select {
      width: 100%;

      padding: 8px 10px;

      color:
        var(--ui-light);

      background:
        var(--ui-dark);

      border:
        1px solid var(--ui-neutral);

      border-radius: 3px;

      font-size: 13px;

      outline: none;
    }

    .mode-select:focus {
      border-color:
        var(--ui-warm);
    }

    .slider-control {
      margin-bottom: 22px;
    }

    .slider-label-row {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 6px;
    }

    .slider-label {
      color:
        var(--ui-light);

      font-size: 13px;
    }

    .slider-value {
      color:
        var(--ui-warm);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size: 12px;
    }

    .control-slider {
      width: 100%;

      accent-color:
        var(--ui-warm);

      cursor: pointer;
    }

    .secondary-button {
      width: 100%;

      padding: 9px 12px;

      color:
        var(--ui-light);

      background:
        transparent;

      border:
        1px solid var(--ui-cool);

      border-radius: 3px;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.04em;

      cursor: pointer;
    }

    .primary-button {
      width: 100%;

      padding: 10px 12px;

      color:
        var(--ui-dark);

      background:
        var(--ui-warm);

      border: 1px solid
        var(--ui-warm);

      border-radius: 3px;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.05em;

      cursor: pointer;
    }

    .primary-button:hover {
      background:
        var(--ui-cool);

      border-color:
        var(--ui-cool);
    }

    .secondary-button:hover {
      color:
        var(--ui-dark);

      background:
        var(--ui-cool);
    }

    .keyboard-hint {
      margin-top: 8px;

      color:
        var(--ui-neutral);

      font-size: 10px;

      text-align: center;
    }
  </style>
</head>

<body>
  <script src="../common/js/palette.js"></script>

  <script src="js/displacementEngine.js"></script>
  <script src="js/displacementModes.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sketch.js"></script>
</body>
</html>
