<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Evidence of Encounter v0.1</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #d2ccbf;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }

    canvas {
      display: block;

      box-shadow:
        0 0 0 1px rgba(120, 105, 85, 0.18),
        0 10px 30px rgba(80, 65, 45, 0.12);
    }

    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;

      padding: 8px 10px;

      background: rgba(216, 211, 199, 0.9);
      border: 1px solid rgba(120, 105, 85, 0.25);
      border-radius: 8px;

      font: 12px/1.45 system-ui, sans-serif;
      color: #3f3a33;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.2/p5.min.js"></script>
</head>

<body>

  <div id="status">
    <strong>Evidence of Encounter v0.1</strong><br>
    Seed: <span id="seedValue">—</span><br>
    R = regenerate · S = save
  </div>

  <script src="../common/js/palette.js"></script>

  <script src="js/Agent.js"></script>
  <script src="js/encounters.js"></script>
  <script src="js/marks.js"></script>
  <script src="js/sketch.js"></script>

</body>

</html>
